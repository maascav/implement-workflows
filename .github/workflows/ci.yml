
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer CMake
        run: cmake -S . -B build

      - name: Compiler
        run: cmake --build build

      - name: Sauvegarder la compilation
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build/

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer la compilation
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: build/

      - name: Autoriser execution du test
        run: chmod +x build/tests/test_cpu_monitor

      - name: Lancer les tests
        run: ctest --test-dir build --output-on-failure
      - name: Lancer les tests
        run: ctest --test-dir build --output-on-failure