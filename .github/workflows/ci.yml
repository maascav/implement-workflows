
name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer CMake
        run: cmake -S . -B build

      - name: Compiler
        run: cmake --build build

      - name: Lancer les tests
        run: ctest --test-dir build --output-on-failure
